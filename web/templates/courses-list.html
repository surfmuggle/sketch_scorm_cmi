{{template "base.html" .}}

{{define "content"}}
<div class="columns">
    <div class="column">
        <nav class="breadcrumb" aria-label="breadcrumbs">
            <ul>
                <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
                <li class="is-active"><a href="#" aria-current="page">Courses</a></li>
            </ul>
        </nav>
        
        <div class="level">
            <div class="level-left">
                <div class="level-item">
                    <h1 class="title is-3">
                        <i class="fas fa-book mr-2"></i>
                        Courses
                    </h1>
                </div>
            </div>
            <div class="level-right">
                <div class="level-item">
                    <a href="/courses/create" class="button is-primary">
                        <i class="fas fa-plus mr-1"></i>
                        Create Course
                    </a>
                    <button onclick="showUploadModal()" class="button is-link ml-2">
                        <i class="fas fa-upload mr-1"></i>
                        Upload SCORM
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Course Statistics -->
        <div class="columns" hx-get="/api/reports/summary" hx-trigger="load" hx-target="#course-stats">
            <div id="course-stats" class="column">
                <div class="box">
                    <div class="content has-text-centered">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p>Loading statistics...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Courses List -->
        <div class="box">
            <div class="level mb-4">
                <div class="level-left">
                    <div class="level-item">
                        <h2 class="subtitle is-5">All Courses</h2>
                    </div>
                </div>
                <div class="level-right">
                    <div class="level-item">
                        <div class="field has-addons">
                            <div class="control has-icons-left">
                                <input class="input" type="text" placeholder="Search courses..." id="course-search">
                                <span class="icon is-small is-left">
                                    <i class="fas fa-search"></i>
                                </span>
                            </div>
                            <div class="control">
                                <button class="button is-info" onclick="filterCourses()">
                                    Search
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div hx-get="/api/courses" hx-trigger="load" hx-target="#courses-container">
                <div id="courses-container">
                    <div class="has-text-centered p-6">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p class="mt-2">Loading courses...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SCORM Upload Modal -->
<div id="uploadModal" class="modal">
    <div class="modal-background" onclick="hideUploadModal()"></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title">
                <i class="fas fa-upload mr-2"></i>
                Upload SCORM Package
            </p>
            <button class="delete" aria-label="close" onclick="hideUploadModal()"></button>
        </header>
        <section class="modal-card-body">
            <form hx-post="/api/packages/upload" hx-encoding="multipart/form-data" hx-target="#upload-result">
                <div class="field">
                    <label class="label">Course Title</label>
                    <div class="control">
                        <input class="input" type="text" name="title" required>
                    </div>
                </div>
                
                <div class="field">
                    <label class="label">Description</label>
                    <div class="control">
                        <textarea class="textarea" name="description" rows="3"></textarea>
                    </div>
                </div>
                
                <div class="field">
                    <label class="label">SCORM Package (ZIP)</label>
                    <div class="control">
                        <div class="file has-name is-fullwidth">
                            <label class="file-label">
                                <input class="file-input" type="file" name="package" accept=".zip" required>
                                <span class="file-cta">
                                    <span class="file-icon">
                                        <i class="fas fa-upload"></i>
                                    </span>
                                    <span class="file-label">Choose a file...</span>
                                </span>
                                <span class="file-name">No file selected</span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="field">
                    <div class="control">
                        <button type="submit" class="button is-primary">
                            <i class="fas fa-upload mr-1"></i>
                            Upload Package
                        </button>
                    </div>
                </div>
            </form>
            
            <div id="upload-result"></div>
        </section>
    </div>
</div>

<script>
function showUploadModal() {
    document.getElementById('uploadModal').classList.add('is-active');
}

function hideUploadModal() {
    const modal = document.getElementById('uploadModal');
    modal.classList.remove('is-active');
    document.getElementById('upload-result').innerHTML = '';
}

function filterCourses() {
    const searchTerm = document.getElementById('course-search').value;
    // Implementation for filtering courses
    console.log('Searching for:', searchTerm);
}

// Handle file input display
document.addEventListener('change', function(e) {
    if (e.target.classList.contains('file-input')) {
        const fileName = e.target.files[0] ? e.target.files[0].name : 'No file selected';
        const fileNameElement = e.target.parentNode.parentNode.querySelector('.file-name');
        if (fileNameElement) {
            fileNameElement.textContent = fileName;
        }
    }
});

// Handle successful upload
document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.xhr.status === 201 && evt.detail.pathInfo.requestPath === '/api/packages/upload') {
        document.getElementById('upload-result').innerHTML = '<div class="notification is-success"><i class="fas fa-check-circle mr-2"></i>Package uploaded successfully!</div>';
        setTimeout(() => {
            hideUploadModal();
            // Refresh the courses list
            htmx.trigger('#courses-container', 'load');
            htmx.trigger('#course-stats', 'load');
        }, 2000);
    }
});
</script>
{{end}}
